name: Create release
run-name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of the program to build. This will be used for the tag and release name."
        required: true

      pre-release:
        description: "Pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QtMsBuild: ${{ github.workspace }}\QtMSBuild

    steps:
      - name: Check the version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^[0-9]{1,9}(\.[0-9]{1,9}){0,3}$') {
            Write-Host "error: version must look like 5.3.0 (got '$env:VERSION')"
            exit 1
          }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: microsoft/setup-msbuild@v2

      - name: Set up vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe integrate install

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.14.2'

      - name: Configure QtToolsPath environment variable
        run: |
          "QtToolsPath=$($env:Qt5_DIR)\bin" >> $env:GITHUB_ENV

      - name: Install dependencies (vcpkg.json)
        run: .\vcpkg\vcpkg.exe install

      - name: Set up the MSVC command line
        uses: ilammy/msvc-dev-cmd@v1

      # Pure decision rules; no Windows, Qt or GPU needed. A failure stops the
      # job before anything is built or published.
      - name: Unit tests
        run: |
          $src = $PWD.Path
          Push-Location $env:RUNNER_TEMP
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 "/I$src\limit-nvpstate" "$src\tests\pstatepolicy_test.cpp" "$src\limit-nvpstate\pstatepolicy.cpp" /Fe:policy_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 "/I$src\limit-nvpstate" "$src\tests\updaterules_test.cpp" "$src\limit-nvpstate\updaterules.cpp" /Fe:updaterules_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\updaterules_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: .\build.ps1 -Version $env:VERSION

      # Check for Updates reads these two assets: the program zip and
      # "<zip>.sha256" (sha256sum format). Without the checksum file it refuses
      # to install automatically.
      - name: Zip release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $zip = "limit-nvpstate-$env:VERSION.zip"
          Compress-Archive -Path build\limit-nvpstate -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n")
          Get-Content "$zip.sha256"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.version }}
          # Tag the commit that was built. Without this, GitHub tags the
          # default branch -- and a release built from another branch gets
          # a tag (and "Source code" archives) that don't match its program.
          commit: ${{ github.sha }}
          name: limit-nvpstate v${{ inputs.version }}
          prerelease: ${{ inputs.pre-release }}
          artifacts: limit-nvpstate-${{ inputs.version }}.zip,limit-nvpstate-${{ inputs.version }}.zip.sha256
          generateReleaseNotes: true
