name: Build
run-name: Build ${{ github.ref_name }}

# Test builds: runs on every push (and by hand) and uploads the packaged
# program as a downloadable artifact. No tag, no release.
on:
  push:
  pull_request:
  workflow_dispatch:

# Test builds only read the repo.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
      QtMsBuild: ${{ github.workspace }}\QtMSBuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: microsoft/setup-msbuild@v2

      - name: Set up vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          .\vcpkg\bootstrap-vcpkg.bat
          .\vcpkg\vcpkg.exe integrate install

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '5.14.2'

      - name: Configure QtToolsPath environment variable
        run: |
          "QtToolsPath=$($env:Qt5_DIR)\bin" >> $env:GITHUB_ENV

      - name: Install dependencies (vcpkg.json)
        run: .\vcpkg\vcpkg.exe install

      - name: Set up the MSVC command line
        uses: ilammy/msvc-dev-cmd@v1

      # Pure decision rules; no Windows, Qt or GPU needed. A failure stops the
      # job before anything is built or published.
      - name: Unit tests
        run: |
          $src = $PWD.Path
          Push-Location $env:RUNNER_TEMP
          cl /nologo /std:c++17 /EHsc /W4 /utf-8 "/I$src\limit-nvpstate" "$src\tests\pstatepolicy_test.cpp" "$src\limit-nvpstate\pstatepolicy.cpp" /Fe:policy_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\policy_test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location

      - name: Build
        run: .\build.ps1

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: limit-nvpstate-${{ github.sha }}
          path: build\limit-nvpstate
          if-no-files-found: error
